name: Catalog (Suwayomi)

# Builds, once a week, the catalogs of the Tachiyomi sources (the keiyoushi
# store) for the sites our own crawlers can't list: the rows of the site
# table with crawl: false (Cloudflare, JavaScript apps, dead list pages) and
# the rows that keep the plugin (plugin: true, galleries too big for the
# spider). Sources of sites not in the table are left out: the app can't
# download from them. It runs through a Suwayomi-Server the runner starts
# (the script and the crawler come from Xopper/manga-downloader, checked
# out with the CODE_SSH_KEY secret), two shards in parallel, and commits the
# files under catalog/ on main next to our crawlers' (catalog.yaml). A shard
# that fails still uploads what it got; the publish job merges every shard,
# pushes, and then goes red if any shard failed.
on:
  schedule:
    - cron: "7 1 * * 0"
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages to crawl, comma separated"
        default: "en"
      max_pages:
        description: "Most pages per listing of a source"
        default: "300"

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

env:
  SUWAYOMI_VERSION: v2.4.2366
  SHARDS: 2

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - name: Check out the crawlers
        uses: actions/checkout@v4
        with:
          repository: Xopper/manga-downloader
          ref: master
          ssh-key: ${{ secrets.CODE_SSH_KEY }}
          path: code

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: code/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        run: cd code && go build -o ../bin/manga-downloader .

      - name: Cache the server JAR
        uses: actions/cache@v4
        with:
          path: ~/.cache/manga-downloader-suwayomi/Suwayomi-Server-${{ env.SUWAYOMI_VERSION }}.jar
          key: suwayomi-${{ env.SUWAYOMI_VERSION }}

      - name: Start Suwayomi
        run: code/tools/suwayomi/run.sh

      - name: Crawl
        id: crawl
        run: |
          set +e
          mkdir -p catalog
          bin/manga-downloader catalog crawl-suwayomi \
            --lang "${{ github.event.inputs.langs || 'en' }}" \
            --max-pages "${{ github.event.inputs.max_pages || '300' }}" \
            --shard "${{ matrix.shard }}/${{ env.SHARDS }}" \
            --timeout 4h40m \
            --skip-crawled --table-only \
            --out catalog 2>&1 | tee crawl.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # the counts from the crawl's last line: "N sources, M written, K failed"
          read -r sources written failed <<< "$(grep -E '^[0-9]+ sources, [0-9]+ written, [0-9]+ failed$' crawl.log | tail -1 | tr -dc '0-9 ')"
          echo "sources=${sources:-0}" >> "$GITHUB_OUTPUT"
          echo "written=${written:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "## Shard ${{ matrix.shard }}: ${written:-0} of ${sources:-0} sources written, ${failed:-0} failed"
            echo
            if grep -qE 'FAIL|skipped' crawl.log; then
              echo '```'
              grep -E 'FAIL|skipped' crawl.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # only what this shard wrote travels to the publish job
          mkdir -p shard
          cp "catalog/sources-${{ matrix.shard }}.json" shard/ 2>/dev/null || true
          grep -E '^[a-z0-9.-]+  [0-9]+ entries' crawl.log | cut -d' ' -f1 | sort -u | while read -r site; do
            cp "catalog/$site.json" shard/ 2>/dev/null || true
          done
          ls shard | wc -l
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: shard
          if-no-files-found: warn

      - name: Fail when most sources failed
        run: |
          sources=${{ steps.crawl.outputs.sources }}
          written=${{ steps.crawl.outputs.written }}
          failed=${{ steps.crawl.outputs.failed }}
          if [ "$written" -eq 0 ] || [ $((failed * 2)) -gt "$sources" ]; then
            echo "::error::$failed of $sources sources failed, $written written: the server or the runner is broken"
            exit 1
          fi

  publish:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out the crawlers
        uses: actions/checkout@v4
        with:
          repository: Xopper/manga-downloader
          ref: master
          ssh-key: ${{ secrets.CODE_SSH_KEY }}
          path: code

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: code/go.sum

      - name: Build
        run: cd code && go build -o ../bin/manga-downloader .

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: catalog

      - name: Index and gzip
        run: bin/manga-downloader catalog index --gzip --out catalog

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A catalog
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          total=$(python3 -c 'import json; print(sum(s["entries"] for s in json.load(open("catalog/index.json"))["sites"]))')
          sources=$(python3 -c 'import json; print(len(json.load(open("catalog/sources.json"))))')
          git commit -qm "Update Suwayomi catalogs: $total entries, $sources sources"
          git push origin HEAD:main

      - name: Fail when a shard failed
        if: needs.crawl.result != 'success'
        run: |
          echo "::error::a shard failed (most of its sources, or its runner); what the others wrote was published"
          exit 1
